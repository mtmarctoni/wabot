onlyBuiltDependencies:
  - ffmpeg-static
  - puppeteer
# 2026-10-25: security overrides. puppeteer-core 18.2.1 (via whatsapp-web.js 1.34.2) pins
# exact vulnerable versions: ws 8.9.0 (GHSA-3h5v-q93c-6h6q, GHSA-96hv-2xvq-fx4p,
# GHSA-58qx-3vcg-4xpx; all fixed by 8.21.0) and tar-fs 2.1.1 (GHSA-8cj5-5rvv-wf4v,
# GHSA-pq67-2wwv-3xjx, GHSA-vj76-c3g6-qr5v; all fixed by 2.1.4). The ws selector also
# matches the speech SDK's ws, which already requires ^8.21.0. Drop both overrides once
# whatsapp-web.js moves to puppeteer 24.
overrides:
  ws@8: ^8.21.0
  tar-fs@2: ^2.1.4
